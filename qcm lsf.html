<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz – Histoire et LSF</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef0fa;color:#20212b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(760px,100%);background:white;border-radius:22px;padding:32px;box-shadow:0 10px 35px rgba(0,0,0,.12)}
h1{margin-top:0;color:#1769d2}
.progress{height:10px;background:#e4e6ee;border-radius:99px;overflow:hidden;margin:18px 0 28px}
.bar{height:100%;background:#1769d2;width:0%;transition:width .25s}
.question{font-size:1.3rem;font-weight:bold;line-height:1.4;margin-bottom:20px}
.sign-image{display:block;max-width:300px;max-height:330px;width:auto;height:auto;margin:0 auto 22px;border-radius:12px;border:1px solid #ddd}
.choices{display:grid;gap:12px}
button.choice{border:2px solid #d9dce7;background:#fff;padding:15px 18px;border-radius:13px;text-align:left;font-size:1rem;cursor:pointer;transition:.15s}
button.choice:hover:not(:disabled){border-color:#1769d2;background:#f3f7ff}.text-answer{width:100%;padding:15px 16px;border:2px solid #d9dce7;border-radius:13px;font-size:1.05rem;outline:none}.text-answer:focus{border-color:#1769d2}
button.choice.correct{border-color:#24a148;background:#e9f8ee}
button.choice.wrong{border-color:#d32f2f;background:#fdecec}
button.choice:disabled{cursor:default}
.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:12px;background:#f1f3f8;line-height:1.45}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
.score{font-weight:bold}
#next,#restart{border:0;background:#1769d2;color:white;padding:12px 20px;border-radius:12px;font-size:1rem;cursor:pointer}
#next:disabled{opacity:.45;cursor:default}
#result{display:none;text-align:center}
#result h2{font-size:2rem}
.small{color:#656978;font-size:.92rem}
</style>
</head>
<body>
<div class="card">
<div id="quiz">
<h1>QCM Histoire de la LSF</h1>
<div class="small" id="counter"></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="visual"></div>
<div class="question" id="question"></div>
<div class="choices" id="choices"></div>
<div class="feedback" id="feedback"></div>
<div class="bottom"><div class="score" id="score">Score : 0</div><button id="next" disabled>Question suivante →</button></div>
</div>
<div id="result">
<h1>Quiz terminé !</h1>
<h2 id="finalScore"></h2>
<p id="message"></p>
<button id="restart">Recommencer</button>
</div>
</div>

let current=0, score=0, answered=false;
const qEl=document.getElementById("question"), cEl=document.getElementById("choices");
const fEl=document.getElementById("feedback"), next=document.getElementById("next");
const scoreEl=document.getElementById("score"), counter=document.getElementById("counter");
const bar=document.getElementById("bar"), visual=document.getElementById("visual");

function shuffle(array){
 const a=[...array];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
 return a;
}
let quizQuestions=shuffle(questions);

function normalizeAnswer(text){
 return text.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ");
}

function showQuestion(){
 answered=false; next.disabled=true; fEl.style.display="none";
 const item=quizQuestions[current];
 counter.textContent=`Question ${current+1} sur ${quizQuestions.length}`;
 bar.style.width=`${current/quizQuestions.length*100}%`;
 qEl.textContent=item.q;
 visual.innerHTML=item.image ? `<img class="sign-image" src="${item.image}" alt="Illustration du signe">` : "";
 cEl.innerHTML="";
 if(item.textAnswer){
   const input=document.createElement("input");
   input.className="text-answer"; input.id="textAnswer"; input.type="text";
   input.placeholder="Écrivez votre réponse…";
   input.onkeydown=(e)=>{if(e.key==="Enter") selectTextAnswer();};
   cEl.appendChild(input);
   const b=document.createElement("button"); b.className="choice"; b.textContent="Valider ma réponse";
   b.onclick=selectTextAnswer; cEl.appendChild(b);
 }else{
   shuffle(item.choices.map((label,index)=>({label,index}))).forEach(({label,index})=>{
     const b=document.createElement("button"); b.className="choice"; b.textContent=label;
     b.dataset.originalIndex=index; b.onclick=()=>selectAnswer(index); cEl.appendChild(b);
   });
 }
}

function finishAnswer(isCorrect,explanation){
 answered=true;
 if(isCorrect) fEl.textContent="✓ Bonne réponse ! "+explanation;
 else fEl.textContent="✗ Pas tout à fait. "+explanation;
 if(isCorrect) score++;
 scoreEl.textContent=`Score : ${score}`;
 fEl.style.display="block"; next.disabled=false;
}

function selectAnswer(i){
 if(answered)return;
 const item=quizQuestions[current];
 const buttons=[...document.querySelectorAll(".choice")];
 buttons.forEach(b=>b.disabled=true);
 const chosen=buttons.find(b=>Number(b.dataset.originalIndex)===i);
 const correct=buttons.find(b=>Number(b.dataset.originalIndex)===item.answer);
 if(i===item.answer){chosen.classList.add("correct");finishAnswer(true,item.explanation);}
 else{chosen.classList.add("wrong");correct.classList.add("correct");finishAnswer(false,item.explanation);}
}

function selectTextAnswer(){
 if(answered)return;
 const item=quizQuestions[current];
 const input=document.getElementById("textAnswer");
 if(!input || !input.value.trim())return;
 const isCorrect=normalizeAnswer(input.value)===normalizeAnswer(item.answerText);
 document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
 input.disabled=true;
 input.style.borderColor=isCorrect ? "#24a148" : "#d32f2f";
 finishAnswer(isCorrect,item.explanation);
}

next.onclick=()=>{
 current++;
 if(current<quizQuestions.length) showQuestion();
 else {
   document.getElementById("quiz").style.display="none";
   document.getElementById("result").style.display="block";
   document.getElementById("finalScore").textContent=`${score} / ${quizQuestions.length}`;
   const r=score/quizQuestions.length;
   document.getElementById("message").textContent=r===1?"Parfait ! Tu maîtrises super bien les notions.":r>=.7?"Bien joué ! Encore quelques notions à retenir.":"Refais le quiz pour t’entraîner et mémoriser les dates.";
 }
};
document.getElementById("restart").onclick=()=>{
 current=0; score=0; quizQuestions=shuffle(questions);
 document.getElementById("result").style.display="none";
 document.getElementById("quiz").style.display="block"; scoreEl.textContent="Score : 0"; showQuestion();
};
showQuestion();
</script>
</body>
</html>
